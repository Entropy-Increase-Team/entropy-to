<!-- https://github.com/panva/node-oidc-provider/blob/main/docs/README.md#logoutsource -->
<!DOCTYPE html>
<html lang="${lang}" dir="${dir}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  ${faviconTag}
  <title>${title}</title>
  <style>
    :root {
      color-scheme: light dark;
      --font-sans: 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      --bg-canvas: #f4f4f6;
      --bg-card: #ffffff;
      --text-primary: #090b0e;
      --text-secondary: #5c616a;
      --text-faint: #68707a;
      --border: rgba(0, 0, 0, 0.08);
      --success-bg: rgba(21, 128, 61, 0.09);
      --success-fg: #15803d;
      --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 3px 6px rgba(0, 0, 0, 0.04);
      --card-radius: 20px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-canvas: #0f1114;
        --bg-card: #161920;
        --text-primary: #f8fafc;
        --text-secondary: #a3adb9;
        --text-faint: #8d97a7;
        --border: rgba(255, 255, 255, 0.08);
        --success-bg: rgba(74, 222, 128, 0.14);
        --success-fg: #4ade80;
        --card-shadow: inset 0 1px rgba(255, 255, 255, 0.04), 0 6px 16px rgba(0, 0, 0, 0.32);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-canvas);
      font-family: var(--font-sans);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .viewBox {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 40px 28px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }

    .icon-badge {
      width: 52px;
      height: 52px;
      border-radius: 9999px;
      background: var(--success-bg);
      color: var(--success-fg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .message {
      font-size: 18px;
      line-height: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .footer {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      line-height: 18px;
      color: var(--text-faint);
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--text-secondary);
      text-decoration: underline;
    }

    .footer img {
      height: 16px;
      width: auto;
      object-fit: contain;
    }

    @media (max-width: 480px) {
      .viewBox {
        padding: 16px;
      }

      main {
        padding: 32px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="viewBox">
    <main>
      <div class="icon-badge" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
          <polyline points="22 4 12 14.01 9 11.01" />
        </svg>
      </div>
      <div class="message">${message}</div>
    </main>
    ${footerHtml}
  </div>
</body>
</html>
