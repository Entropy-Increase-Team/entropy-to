name: Main

on:
  push:
    branches:
      - master
      - "push-action/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  main-generated-files:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 12
          node-version: ^26.0.0

      - name: Sync connector presets
        run: pnpm run pnpm:devPreinstall

      - name: Check connector generated files
        run: |
          if ! git diff --exit-code -- packages/connectors; then
            echo "Connector package presets are out of sync. Run 'pnpm run pnpm:devPreinstall' and commit the changes."
            exit 1
          fi

  main-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 12
          node-version: ^26.0.0

      - name: Build
        run: pnpm ci:build

  main-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 12
          node-version: ^26.0.0

      - name: Prepack
        run: pnpm prepack

      - name: Check
        run: pnpm -r check

  main-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 12
          node-version: ^26.0.0

      - name: Prepack
        run: pnpm prepack

      - name: Lint
        run: pnpm ci:lint

      - name: Stylelint
        run: pnpm ci:stylelint

  main-test:
    # Playwright has no browser build for the `ubuntu-26.04` image that `ubuntu-latest` now
    # resolves to, so `playwright install --with-deps` fails before any test runs. Pin the image
    # until Playwright ships support, as `integration-test.yml` already does for Puppeteer.
    runs-on: ubuntu-24.04
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 12
          node-version: ^26.0.0

      - name: Build for test
        run: pnpm -r build:test

      - name: Build connectors for metadata tests
        run: pnpm connectors build

      # Playwright 1.56's browser installer hangs on Node.js 26; the `overrides` in
      # pnpm-workspace.yaml pin 1.64.1 so this step and the element tests use a version that works.
      - name: Install playwright for element tests
        working-directory: ./packages/elements
        timeout-minutes: 20
        run: pnpm exec playwright install --with-deps chromium

      - name: Setup Postgres
        uses: ikalnytskyi/action-setup-postgres@v6

      - name: Setup job queue test database
        run: pnpm cli db seed --test
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/job_queue_test

      - name: Test
        run: pnpm ci:test
        env:
          JOB_QUEUE_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/job_queue_test

      - name: Codecov core
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          flags: core
          directory: ./packages/core
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov ui
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          flags: ui
          directory: ./packages/ui
          token: ${{ secrets.CODECOV_TOKEN }}

  main-dockerize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: | # Test cloud build
            additional_connector_args=--cloud

  main-alteration:
    runs-on: ubuntu-latest

    steps:
      # ** Checkout fresh and alteration ref **
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ./fresh

      # Fetch the current version by finding the latest `@logto/core@*` tag
      - id: version
        working-directory: ./fresh
        run: |
          current="$(git describe --match "@logto/core@*" --abbrev=0 2>/dev/null || true)"
          if [ -z "$current" ]; then
            echo "::warning::No @logto/core@* tag found; skipping tag-based alteration up/down comparison."
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.version.outputs.current != ''
        with:
          ref: ${{ steps.version.outputs.current }}
          path: ./alteration
      # ** End **

      - name: Copy lockfile # Make setup workflow happy
        run: cp ./fresh/pnpm-lock.yaml ./

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 12
          node-version: ^26.0.0
          run-install: false

      # Releases before the pnpm 12 upgrade keep their pnpm settings in the `pnpm` field of
      # package.json, which pnpm 12 ignores, so run their steps with pnpm 10.
      - name: Setup pnpm for alteration
        if: steps.version.outputs.current != ''
        working-directory: ./alteration
        run: |
          if jq -e '.pnpm' package.json > /dev/null; then
            npm i -g --prefix "$RUNNER_TEMP/pnpm-10" pnpm@10
            echo "ALTERATION_PNPM_BIN=$RUNNER_TEMP/pnpm-10/bin:" >> "$GITHUB_ENV"
          fi

      # ** Prepack packages **
      - name: Prepack fresh
        if: steps.version.outputs.current != ''
        working-directory: ./fresh
        run: pnpm i && pnpm prepack

      - name: Prepack alteration
        if: steps.version.outputs.current != ''
        working-directory: ./alteration
        run: |
          export PATH="$ALTERATION_PNPM_BIN$PATH"
          pnpm i && pnpm prepack
      # ** End **

      - name: Setup Postgres
        if: steps.version.outputs.current != ''
        uses: ikalnytskyi/action-setup-postgres@v6

      # ** Setup up-to-date databases and compare (test `up`) **
      - name: Setup fresh database
        if: steps.version.outputs.current != ''
        working-directory: ./fresh
        run: pnpm cli db seed --test
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/fresh

      - name: Setup alteration database
        if: steps.version.outputs.current != ''
        working-directory: ./alteration
        run: |
          export PATH="$ALTERATION_PNPM_BIN$PATH"
          cd packages/cli
          pnpm start db seed --test
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/alteration

      - name: Run alteration scripts
        if: steps.version.outputs.current != ''
        working-directory: ./fresh
        run: pnpm cli db alt deploy next
        env:
          ALTERATION_TEST: true
          DB_URL: postgres://postgres:postgres@localhost:5432/alteration

      - name: Compare databases
        if: steps.version.outputs.current != ''
        working-directory: ./fresh
        run: node .scripts/compare-database.js fresh alteration
      # ** End **

      # ** Setup old databases and compare (test `down`) **
      - name: Setup old database
        if: steps.version.outputs.current != ''
        working-directory: ./alteration
        run: |
          export PATH="$ALTERATION_PNPM_BIN$PATH"
          cd packages/cli
          pnpm start db seed --test
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/old

      - name: Revert fresh database to old
        if: steps.version.outputs.current != ''
        working-directory: ./fresh
        run: pnpm cli db alt r v$(echo ${{ steps.version.outputs.current }} | cut -d@ -f3)
        env:
          ALTERATION_TEST: true
          DB_URL: postgres://postgres:postgres@localhost:5432/fresh

      - name: Compare manifests
        if: steps.version.outputs.current != ''
        working-directory: ./fresh
        run: node .scripts/compare-database.js fresh old
      # ** End **

      - name: Check alteration sequence
        if: steps.version.outputs.current != ''
        working-directory: ./fresh
        run: node .scripts/check-alterations-sequence.js
