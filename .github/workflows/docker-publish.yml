name: Publish Docker Image to Docker Hub

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target build platforms (use linux/amd64,linux/arm64 for multi-arch)'
        required: false
        default: 'linux/amd64'
        type: choice
        options:
          - 'linux/amd64'
          - 'linux/arm64'
          - 'linux/amd64,linux/arm64'
      custom_tag:
        description: 'Optional extra tag to publish (e.g. prod-20261128)'
        required: false
        default: ''
        type: string
      dev_features_enabled:
        description: 'Enable in-development features during build'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      IMAGE_NAME: dnyo666/entropy-to

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Missing repository secret DOCKERHUB_TOKEN. Configure it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Resolve target platforms
        id: platforms
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          if [ -n "$INPUT_PLATFORMS" ]; then
            echo "value=$INPUT_PLATFORMS" >> "$GITHUB_OUTPUT"
          else
            echo "value=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (when building arm64)
        if: contains(steps.platforms.outputs.value, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'dnyo666' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.custom_tag }},enable=${{ inputs.custom_tag != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            dev_features_enabled=${{ inputs.dev_features_enabled && '1' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
